<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Pedidos — Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.92em'%20font-size='92'%3E%F0%9F%98%B1%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="brand"><span class="dot-brand"></span><strong>Panel de Pedidos</strong></div>
    <h1>Agendamiento y alertas</h1>
    <div class="subt">Notificaciones de documentación por caso — WAN/LAN, Investigación IDS y No identificada. Inicia sesión para ver los pedidos compartidos por todo el equipo.</div>

    <form id="formLogin">
      <div class="field">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn primary" id="btnEntrar">Entrar</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>

    <div class="setup-note" id="setupNote">
      Cargando configuración…
    </div>
  </div>
</div>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
(function(){
  "use strict";

  const setupNote = document.getElementById("setupNote");
  const errorMsg = document.getElementById("errorMsg");
  const btnEntrar = document.getElementById("btnEntrar");

  if (typeof firebaseConfig === "undefined" || !firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf("TU_") === 0){
    setupNote.innerHTML = "⚠ Falta configurar <code>firebase-config.js</code> con los datos de tu proyecto de Firebase antes de poder iniciar sesión.";
    btnEntrar.disabled = true;
    return;
  }

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  setupNote.innerHTML = 'Primer uso? Abre la consola del navegador (F12) y ejecuta <code>hashPassword("tuClave")</code> para generar el valor que debes pegar como <code>passwordHash</code> del primer usuario administrador directamente en Firestore (colección <code>usuarios</code>).';

  async function hashTexto(texto){
    const enc = new TextEncoder().encode(texto);
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  // utilidad expuesta para crear el primer usuario admin manualmente desde la consola
  window.hashPassword = hashTexto;

  document.getElementById("formLogin").addEventListener("submit", async (e)=>{
    e.preventDefault();
    errorMsg.textContent = "";
    const usuario = document.getElementById("usuario").value.trim().toLowerCase();
    const clave = document.getElementById("clave").value;

    if (!usuario || !clave){
      errorMsg.textContent = "Completa usuario y contraseña.";
      return;
    }

    btnEntrar.disabled = true;
    btnEntrar.textContent = "Entrando…";

    try{
      // sesión anónima de Firebase: solo sirve para que las reglas de Firestore
      // exijan "estar conectado a la app" (request.auth != null); el usuario/clave
      // reales del panel se validan aparte, contra la colección "usuarios".
      if (!auth.currentUser){
        await auth.signInAnonymously();
      }

      const doc = await db.collection("usuarios").doc(usuario).get();
      if (!doc.exists){
        errorMsg.textContent = "Usuario o contraseña incorrectos.";
        btnEntrar.disabled = false;
        btnEntrar.textContent = "Entrar";
        return;
      }

      const datos = doc.data();
      const hashIngresado = await hashTexto(clave);
      if (hashIngresado !== datos.passwordHash){
        errorMsg.textContent = "Usuario o contraseña incorrectos.";
        btnEntrar.disabled = false;
        btnEntrar.textContent = "Entrar";
        return;
      }

      sessionStorage.setItem("pp_usuario", usuario);
      sessionStorage.setItem("pp_nombre", datos.nombre || usuario);
      sessionStorage.setItem("pp_rol", datos.rol || "usuario");
      window.location.href = "panel.html";

    }catch(err){
      errorMsg.textContent = "No se pudo conectar con la base de datos: " + err.message;
      btnEntrar.disabled = false;
      btnEntrar.textContent = "Entrar";
    }
  });
})();
</script>

</body>
</html>
